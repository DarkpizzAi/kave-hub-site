<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>tests</title></head>
<body><div id="out"></div>
<script type="module">
  if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    document.getElementById('out').textContent = 'Tests run only on localhost.';
  } else {
    await import('./data.test.js');
    await import('./md.test.js');
    await import('./glyphs.test.js');
    await import('./prefs.test.js');
    const { runAll } = await import('./run.js');
    runAll();
  }
</script></body></html>
