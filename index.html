<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://darkpizzai.github.io; connect-src 'self' https://api.github.com; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<!-- The hub's own icon, in the apps' format: cobalt with the white "hub" symbol
     (kave-hub brand/icons/hub/, Isa, 05/11/2026). -->

<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- link previews (WhatsApp, Messages): read from this HTML by the messenger's crawler,
